name: Daily Reset

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Call reset
        run: |
          curl -X POST https://changang-backend-production.up.railway.app/reset \
          -H "Authorization: Bearer changeme"

